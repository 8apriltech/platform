<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login · 8April Hub</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    
    <style>

    :root {

    --bg-card: rgba(15, 23, 42, 0.72);

    --border: rgba(255,255,255,0.05);

    --text: #f8fafc;
    --muted: #94a3b8;

    --blue: #38bdf8;
    --green: #22c55e;
    --red: #ef4444;

    --shadow:
        0 0 25px rgba(0,0,0,.35),
        0 0 20px rgba(0,140,255,.04);

    --shadow-hover:
        0 0 30px rgba(0,255,180,.08),
        0 0 45px rgba(0,140,255,.12);

    }

    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }

    /* =========================
    BODY
    ========================= */

    body {

    font-family: 'Segoe UI', sans-serif;

    color: var(--text);

    display: flex;

    align-items: center;

    justify-content: center;

    min-height: 100vh;

    overflow: hidden;

    padding: 20px;

    background:
        linear-gradient(
        rgba(2, 6, 23, .92),
        rgba(2, 6, 23, .96)
        ),

        url('https://i.ibb.co/jvWBrnKh/4a89f731-ec6d-45e7-95ec-bc7990ddf87c.png');

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    }

    /* glow ambiente */

    body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:

        radial-gradient(
        circle at top left,
        rgba(0,255,180,.08),
        transparent 25%
        ),

        radial-gradient(
        circle at bottom right,
        rgba(0,140,255,.08),
        transparent 30%
        );

    pointer-events: none;

    z-index: -1;
    }

    /* grid tecnológica */

    body::after {

    content: "";

    position: fixed;

    inset: 0;

    background-image:

        linear-gradient(
        rgba(255,255,255,.015) 1px,
        transparent 1px
        ),

        linear-gradient(
        90deg,
        rgba(255,255,255,.015) 1px,
        transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;

    z-index: -1;
    }

    /* =========================
    LOGIN BOX
    ========================= */

    .login-box {

    width: 100%;

    max-width: 380px;

    background: var(--bg-card);

    backdrop-filter: blur(14px);

    border:
        1px solid var(--border);

    border-radius: 24px;

    padding: 38px;

    box-shadow:
        var(--shadow);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;

    position: relative;

    overflow: hidden;
    }

    /* brilho interno */

    .login-box::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
        135deg,
        rgba(255,255,255,.03),
        transparent
        );

    pointer-events: none;
    }

    /* hover neon */

    .login-box:hover {

    transform:
        translateY(-4px);

    border-color:
        rgba(0,255,180,.22);

    box-shadow:
        var(--shadow-hover);
    }

    /* glow lateral */

    .login-box:hover::after {

    content: "";

    position: absolute;

    top: -50%;

    right: -20%;

    width: 180px;
    height: 180px;

    background:
        radial-gradient(
        circle,
        rgba(0,255,180,.10),
        transparent 70%
        );

    pointer-events: none;
    }

    /* =========================
    LOGO
    ========================= */

    .logo {

    display: block;

    margin:
        0 auto 24px auto;

    width: 100%;

    max-width: 130px;

    object-fit: contain;

    filter:
        drop-shadow(
        0 0 18px rgba(0,140,255,.20)
        );
    }

    /* =========================
    TITLES
    ========================= */

    h1 {

    text-align: center;

    margin-bottom: 8px;

    color: white;

    font-size: 28px;

    font-weight: 700;

    text-shadow:
        0 0 18px rgba(0,140,255,.15);
    }

    .subtitle {

    text-align: center;

    font-size: 13px;

    color: var(--muted);

    margin-bottom: 28px;

    letter-spacing: .4px;
    }

    /* =========================
    LABELS
    ========================= */

    label {

    font-size: 13px;

    color: var(--muted);

    display: block;

    margin-bottom: 6px;
    }

    /* =========================
    INPUTS
    ========================= */

    input {

    width: 100%;

    padding: 13px;

    margin-bottom: 18px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,.05);

    background:
        rgba(15, 23, 42, .85);

    color: white;

    box-sizing: border-box;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        transform .2s ease;
    }

    input::placeholder {
    color: #64748b;
    }

    input:focus {

    outline: none;

    transform:
        translateY(-1px);

    border-color:
        rgba(0,255,180,.28);

    box-shadow:
        0 0 0 4px rgba(0,255,180,.08);
    }

    /* =========================
    BUTTON
    ========================= */

    button {

    width: 100%;

    padding: 13px;

    border-radius: 12px;

    border: none;

    background:
        linear-gradient(
        135deg,
        #38bdf8,
        #2563eb
        );

    color: white;

    font-weight: 700;

    cursor: pointer;

    font-size: 14px;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 0 25px rgba(56,189,248,.25);
    }

    /* =========================
    ERROR
    ========================= */

    .error {

    margin-top: 16px;

    color: #f87171;

    font-size: 13px;

    text-align: center;

    display: none;

    padding: 12px;

    border-radius: 12px;

    background:
        rgba(239,68,68,.10);

    border:
        1px solid rgba(239,68,68,.18);
    }

    /* =========================
    RESPONSIVO
    ========================= */

    @media (max-width: 500px) {

    .login-box {

        padding: 28px;
    }

    h1 {

        font-size: 24px;
    }

    }

    .footer-brand::before {

        content: "";

        display: block;

        width: 120px;

        height: 1px;

        margin: 0 auto 14px auto;

        background:
            linear-gradient(
            90deg,
            transparent,
            rgba(0,255,180,.35),
            transparent
            );
    }

    .page-wrapper {

        display: flex;

        flex-direction: column;

        align-items: center;

        width: 100%;
    }

    .footer-brand {

        margin-top: 36px;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        text-align: center;

        color: rgba(255,255,255,0.42);

        font-size: 12px;

        letter-spacing: .4px;
    }

    .footer-brand img {

        width: 120px;

        margin-bottom: 0px;

        opacity: .82;

        object-fit: contain;

        filter:
            drop-shadow(0 0 10px rgba(0,255,180,.12));

        transition:
            transform .25s ease,
            opacity .25s ease;
    }

    .footer-brand img:hover {

        transform: translateY(-2px);

        opacity: 1;
    }

</style>

</head>

<body>

<div class="page-wrapper">

<div class="login-box">

    <img 
        src="https://i.ibb.co/7JrZkrJ2/8541d06a-0aa0-497e-b698-53419c0dbe75.png" 
        alt="Logo 8April"
        class="logo"
    >

    <h1>8April Hub</h1>

    <div class="subtitle">
        CRM · Ordens de Serviço · BI
    </div>

    <label>Email</label>
    <input type="email" id="email" placeholder="seu@email.com">

    <label>Senha</label>
    <input type="password" id="password" placeholder="••••••••">

    <button onclick="login()">
        Entrar
    </button>

    <div class="error" id="error">
    Credenciais inválidas
    </div>

    </div> <!-- FECHA LOGIN-BOX -->

    <div class="footer-brand">
        
          <a 
            href="https://8april.com.br"
            target="_blank"
            class="footer-logo-link"
            >
            <img 
                src="https://i.ibb.co/twv6Dfmt/Chat-GPT-Image-14-de-mai-de-2026-08-39-00.png"
                alt="8April Logo"
            >
            </a>
        <span>
        © 2026 · 8April Tech · Todos os direitos reservados.
        </span>
    </div>

</div> <!-- FECHA PAGE-WRAPPER -->

<script>

const client = window.supabase.createClient(
    "https://exrvjejlhtdjdhcuzwth.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4cnZqZWpsaHRkamRoY3V6d3RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0MTk2NDQsImV4cCI6MjA4NTk5NTY0NH0.Jd_gn8bvcDyw5RjiXIL5FePT6mTg6B1tDbBKw-hRakc"
);

// Se já estiver logado → manda pro hub
verificarSessao();

async function verificarSessao() {

    const { data: { session } } = await client.auth.getSession();

    if (session) {
        window.location.href = "https://app.8april.com.br";
    }
}

async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("error");

    errorBox.style.display = "none";

    const { data, error } = await client.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        console.error(error);

        errorBox.innerText = "Email ou senha inválidos";
        errorBox.style.display = "block";

        return;
    }

    localStorage.setItem("user_email", email);

    window.location.href = "https://app.8april.com.br";
}

</script>

</body>

</html>
